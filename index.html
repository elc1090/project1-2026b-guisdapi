<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet"></head>
    <link rel="stylesheet" href="style.css">
    <title>My Notes Apps</title>
<body>
    <header class="top-bar">
        <h1>My Notes</h1>

        <div class="search-wrapper">
            <input type="text" id="search" placeholder="Search notes...">
            <button id="searchBtn" class="circular-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </div>
    </header>

    <div class="container">

        <div id="input-box">
           <input type="text" id="addTitle" placeholder="Title">
            <textarea name="" id="addText" cols="30" rows="10" placeholder="Take a note.."></textarea>
            
            <button id="addNote">Add</button>
        </div>

        <div id="notes">
        </div>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
